<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Center Monogram A with Futuristic Tech Nodes -->
  <g filter="url(#glow)">
    <!-- Main A Shape -->
    <path d="M 256 96 L 384 396 L 316 396 L 286 324 L 226 324 L 196 396 L 128 396 Z M 256 196 L 238 274 L 274 274 Z" fill="url(#glyphGrad)" />
    
    <!-- Sparkle / Tech Accent Top Right -->
    <path d="M 370 120 Q 370 145 395 145 Q 370 145 370 170 Q 370 145 345 145 Q 370 145 370 120 Z" fill="#38bdf8" />
    
    <!-- Sparkle / Accent -->
    <circle cx="150" cy="350" r="10" fill="#a78bfa" />
    <circle cx="362" cy="350" r="10" fill="#38bdf8" />
  </g>
</svg>